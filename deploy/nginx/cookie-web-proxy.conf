# /etc/nginx/snippets/cookie-web-proxy.conf — proxy settings shared by the cookie-web locations.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# live progress is streamed (server-sent events): pass it through as it comes
proxy_buffering off;
proxy_cache off;
# a deep research request can take many minutes on a small CPU
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
