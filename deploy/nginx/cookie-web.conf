# /etc/nginx/sites-available/cookie-web — written by scripts/setup-nginx.sh
# (__PORT__, __WATCH_PORT__ and __SERVER_NAME__ are filled in by the script.)

# wrong-password guessing is also limited inside cookie-web; this stops floods before they get there
limit_req_zone $binary_remote_addr zone=cookie_login:1m rate=10r/m;

upstream cookie_web {
    server 127.0.0.1:__PORT__;
    keepalive 16;
}

upstream cookie_watch {
    server 127.0.0.1:__WATCH_PORT__;
    keepalive 4;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json text/markdown text/plain image/svg+xml;

    # The watchdog: answers even when cookie-web is down. Status page: /watch/  JSON: /watch/status
    location /watch/ {
        proxy_pass http://cookie_watch;
        include snippets/cookie-web-proxy.conf;
    }
    location = /watch {
        return 301 /watch/;
    }
    # heartbeats come from cookie-web on this machine, never from outside
    location ~ ^/watch/(beat|bye)$ {
        return 404;
    }

    location = /login {
        limit_req zone=cookie_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://cookie_web;
        include snippets/cookie-web-proxy.conf;
        error_page 502 503 504 = @offline;
    }

    location / {
        proxy_pass http://cookie_web;
        include snippets/cookie-web-proxy.conf;
        # cookie-web not running: show the status page (or a JSON error for API calls) instead of
        # nginx's "502 Bad Gateway". Errors cookie-web itself returns are passed through unchanged.
        error_page 502 503 504 = @offline;
    }

    location @offline {
        add_header Cache-Control no-store always;
        add_header Retry-After 10 always;
        # so browser clients on other origins (the console) can read it
        add_header Access-Control-Allow-Origin * always;
        default_type application/json;
        if ($uri ~ ^/api/) {
            return 503 '{"error":"cookie-web is offline","status_url":"/watch/status"}\n';
        }
        return 302 /watch/?from=$uri;
    }
}
