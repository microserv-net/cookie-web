# systemd drop-in for Ollama on a dedicated cookie-web box.
# scripts/install-ollama.sh installs this for you (as ollama.service.d/cookie-web.conf).
# By hand:  sudo systemctl edit ollama   (paste this), then: sudo systemctl restart ollama
[Service]
Environment="OLLAMA_KEEP_ALIVE=-1"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
Environment="OLLAMA_HOST=127.0.0.1:11434"
# Lower CPU priority: the model uses every core while answering; this keeps SSH and cookie-web responsive.
Nice=10
CPUWeight=50
