<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cookie-web · sign in</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <main class="login">
    <form method="post" action="/login" class="login-card">
      <div class="brand">
        <img src="/favicon.svg" alt="" width="32" height="32">
        <span>cookie<b>-web</b></span>
      </div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <input id="next" name="next" type="hidden" value="/">
      <p id="error" class="login-error" hidden></p>
      <button type="submit">Sign in</button>
      <p class="muted small">The password is <code>COOKIE_PASSWORD</code> on the server, or the API key
        (<code>COOKIE_API_KEY</code>) if no password is set.</p>
    </form>
  </main>
  <script>
    const p = new URLSearchParams(location.search);
    const next = p.get("next");
    if (next && next.startsWith("/") && !next.startsWith("//")) document.getElementById("next").value = next;
    const err = document.getElementById("error");
    if (p.get("error") === "1") { err.textContent = "Wrong password."; err.hidden = false; }
    if (p.get("error") === "locked") { err.textContent = "Too many wrong passwords. Try again in a few minutes."; err.hidden = false; }
  </script>
</body>
</html>
